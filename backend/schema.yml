          - $ref: '#/components/schemas/ComplaintStatusEnum'
          readOnly: true
        admin_investigation_notes:
          type: string
          readOnly: true
        resolution_notes:
          type: string
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
