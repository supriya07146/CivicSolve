          type: string
          format: uuid
          readOnly: true
        target_type:
          $ref: '#/components/schemas/TargetTypeEnum'
        problem:
          type: integer
          nullable: true
        problem_title:
          type: string
          readOnly: true
        target_organization:
          type: integer
          nullable: true
        target_organization_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        status:
